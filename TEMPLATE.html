<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Tricks Demo</title>

<style>
/* RESET */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

/* ===================== */
/* CENTER GRID */
.center {
  display: grid;
  place-items: center;
  height: 100vh;
}

.box {
  padding: 40px;
  background: #4CAF50;
  border-radius: 12px;
  font-size: 24px;
}

/* ===================== */
/* CARD HOVER */
.card {
  width: 200px;
  padding: 20px;
  margin: 40px auto;
  background: white;
  color: black;
  border-radius: 12px;
  transition: all 0.3s ease;
  text-align: center;
}

.card:hover {
  transform: translateY(-10px) scale(1.03);
  box-shadow: 0 15px 25px rgba(0,0,0,0.3);
}

/* ===================== */
/* GRADIENT BG */
.bg {
  height: 200px;
  background: linear-gradient(270deg, #ff6ec4, #7873f5, #4ADEDE);
  background-size: 600% 600%;
  animation: gradientMove 8s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===================== */
/* BUTTON RIPPLE */
.btn {
  position: relative;
  overflow: hidden;
  padding: 12px 24px;
  border: none;
  background: #6200ea;
  color: white;
  cursor: pointer;
  display: block;
  margin: 40px auto;
}

.btn::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.4s, height 0.4s;
}

.btn:active::after {
  width: 200px;
  height: 200px;
}

/* ===================== */
/* NEON TEXT */
.neon {
  text-align: center;
  font-size: 40px;
  margin-top: 40px;
  text-shadow:
    0 0 5px #0ff,
    0 0 10px #0ff,
    0 0 20px #0ff,
    0 0 40px #0ff;
}

/* ===================== */
/* LOADER */
.loader {
  margin: 40px auto;
  width: 50px;
  height: 50px;
  border: 5px solid #ccc;
  border-top: 5px solid #333;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>

</head>
<body>

<!-- CENTER GRID -->
<div class="center">
  <div class="box">Halo!</div>
</div>

<!-- CARD -->
<div class="card">Hover aku</div>

<!-- GRADIENT -->
<div class="bg"></div>

<!-- BUTTON -->
<button class="btn">Klik</button>

<!-- NEON -->
<h1 class="neon">NEON</h1>

<!-- LOADER -->
<div class="loader"></div>

</body>
</html>
